name: Data build

# Manual smoke test of the pipeline (SPEC §7). Runs the data build for one area
# and reports sizes and durations, without deploying anything.
on:
  workflow_dispatch:
    inputs:
      area:
        description: Area to build
        type: choice
        options: [dev, italy]
        default: dev
      step:
        description: Single step to run (blank = all)
        type: string
        default: ''
      force:
        description: Ignore the step cache
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: make data AREA=${{ inputs.area }}
    runs-on: ubuntu-latest
    # An italy build is hours of work; dev is minutes.
    timeout-minutes: ${{ inputs.area == 'italy' && 720 || 60 }}

    env:
      AREA: ${{ inputs.area }}
      FORCE: ${{ inputs.force && '1' || '0' }}

    steps:
      - uses: actions/checkout@v5

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Free up disk space
        run: |
          # The hosted runner ships ~30 GB of tooling we do not need; an italy
          # build needs every gigabyte it can get.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Build the pipeline image
        run: make -C pipeline image

      - name: Run the pipeline
        run: |
          if [ -n "${{ inputs.step }}" ]; then
            make -C pipeline "${{ inputs.step }}" AREA=$AREA FORCE=$FORCE
          else
            make data AREA=$AREA
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "### Data build — AREA=$AREA"
            echo ''
            echo '```'
            make data-summary AREA=$AREA || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manifest-${{ inputs.area }}
          path: data/manifest.json
          if-no-files-found: warn
          retention-days: 30
